# CUDA-Lite Linux Security Hardening Configuration
# Applied during boot via /etc/sysctl.d/99-cuda-lite-hardening.conf
# Satisfies Assignment Requirement E: At least three justified hardening measures.

# -----------------------------------------------------------------------------
# Measure 1: Kernel Pointer Restriction & ASLR Enforcement
# Rationale: Prevents unprivileged processes from leaking kernel memory addresses,
# neutralizing return-oriented programming (ROP) and kernel exploit payload delivery.
# -----------------------------------------------------------------------------
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.randomize_va_space = 2

# -----------------------------------------------------------------------------
# Measure 2: Unprivileged BPF & Ptrace Sandboxing
# Rationale: Disables unprivileged Berkeley Packet Filter (eBPF) execution to eliminate
# Spectre-style side-channel microarchitectural attacks against GPU/CPU memory spaces.
# Also restricts ptrace scope to direct parents only.
# -----------------------------------------------------------------------------
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.yama.ptrace_scope = 2

# -----------------------------------------------------------------------------
# Measure 3: Network Stack Hardening & Denial-of-Service Mitigation
# Rationale: CUDA compute nodes only require minimal remote access (e.g., SSH).
# Hardens against SYN flood attacks, IP spoofing, source routing, and ICMP redirects.
# -----------------------------------------------------------------------------
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1

# -----------------------------------------------------------------------------
# Measure 4: Filesystem & Core Dump Protection
# Rationale: Protects symbolic and hard link exploitation in sticky directories (/tmp),
# and prevents memory dump extraction containing sensitive matrix data or weights.
# -----------------------------------------------------------------------------
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
